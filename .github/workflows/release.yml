# 发刊发布：打上「刊号 tag」（如 CS26-0801-TP，即期目录名）并推送后，
# 自动把该期的 md / html / pdf 三份成品与 sources/ 中间稿发布为 GitHub Release。
# Release Note 由 HISTORY.md 生成（scripts/release_notes.py）。
name: 发刊发布

on:
  push:
    tags:
      - 'CS*'            # 自封刊号 tag，形如 CS26-0801-TP

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 1) 生成 Release Note；tag 即期目录名，直接定位 issues/<tag>/
      - name: 生成 Release Note
        id: notes
        run: |
          set -euo pipefail
          TAG="${{ github.ref_name }}"
          ISSUE_N="$(python3 scripts/release_notes.py \
            --dirname "$TAG" --issue-only)"
          python3 scripts/release_notes.py \
            --dirname "$TAG" --history HISTORY.md > RELEASE_NOTES.md
          echo "ISSUE_N=$ISSUE_N" >> "$GITHUB_ENV"

      # 2) 打包资产：三份成品以「刊号」重命名上传（下载文件名一目了然，且规避 GitHub
      #    对非 ASCII 文件名的简化），另打整期 zip（含 sources/ 中间稿）。
      #    zip 用 Python 标准库 shutil.make_archive，避免依赖 runner 是否预装 zip 命令
      - name: 打包资产
        run: |
          set -euo pipefail
          TAG="${{ github.ref_name }}"
          mkdir -p dist
          cp "issues/$TAG"/CSSEC*.md   "dist/$TAG.md"
          cp "issues/$TAG"/CSSEC*.html "dist/$TAG.html"
          cp "issues/$TAG"/CSSEC*.pdf  "dist/$TAG.pdf"
          python3 - "$TAG" <<'PY'
          import shutil, sys
          tag = sys.argv[1]
          shutil.make_archive(f"dist/CSSEC-Weekly-{tag}", "zip", root_dir=f"issues/{tag}")
          PY

      # 3) 为已存在的 tag 建 Release 并挂资产（资产均为纯 ASCII 刊号名，由 action 的 glob 处理）
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: CSSEC 周报 第 ${{ env.ISSUE_N }} 期
          body_path: RELEASE_NOTES.md
          files: dist/*
          draft: false
